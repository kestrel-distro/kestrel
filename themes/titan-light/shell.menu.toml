# Titan: the menu is the bar's paper extending down. A steel hairline,
# a scrim one shade darker than the sheet, and the accent on the chosen row.
[menu]
background                = "#f4f5f7"
background-alpha          = 1.0
text                      = "#23232e"
border                    = "#5a9ebf"
border-alpha              = 0.45
scrim                     = "#dfe1e8"
scrim-alpha               = 0.5
selected-background       = "#23232e"
selected-background-alpha = 0.08
selected-text             = "#5a9ebf"
selected-border           = "#5a9ebf"
selected-border-alpha     = 0.35
