#
# /etc/rtirq.conf
#
# Kestrel tuning of rtirq (Arch package `rtirq`). Configuration for IRQ thread
# tuning, for `threadirqs` enabled kernels (Kestrel sets `threadirqs` on the
# kernel command line; see etc/limine-entry-tool.d/kestrel-defaults.conf).
#
# Differences from the upstream default: the IRQ thread name list also covers
# the GPU drivers (amdgpu, xe, i915, nvidia, nouveau), so a busy display plane
# does not sit behind ordinary work at the same priority as everything else.
# `rtc` and `snd` stay non-threaded to keep timer and audio IRQ latency low.

# IRQ thread service names
# (space separated list, from higher to lower priority).
RTIRQ_NAME_LIST="snd snd-usb usb i8042 amdgpu xe i915 nvidia nouveau"

# Highest priority.
RTIRQ_PRIO_HIGH=90

# Priority decrease step.
RTIRQ_PRIO_DECR=5

# Lowest priority.
RTIRQ_PRIO_LOW=51

# Whether to reset all IRQ threads to SCHED_OTHER.
RTIRQ_RESET_ALL=0

# On kernel configurations that support it,
# which services should be NOT threaded
# (space separated list).
RTIRQ_NON_THREADED="rtc snd"

# Save/restore state file path.
#RTIRQ_STATE=/var/run/rtirq.state
