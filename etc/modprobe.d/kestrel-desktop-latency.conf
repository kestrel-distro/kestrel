# Desktop input latency: sample USB HID mice every 1 ms (1000 Hz) instead of
# the device's default report interval, so pointer motion reaches the
# compositor sooner. This raises idle wakeups slightly, which is acceptable
# because USB autosuspend is already disabled (kestrel-usb-autosuspend.conf);
# the trade is already paid toward latency.
options usbhid mousepoll=1
