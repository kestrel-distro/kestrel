TARGET_OS_NAME="Kestrel"

# Kestrel keeps the bare kernel/systemd startup log visible instead of hiding it
# behind a Plymouth boot splash. The log-suppressing parameters the stock
# configuration shipped
# (quiet splash loglevel=0 systemd.show_status=false rd.udev.log_level=0) are
# deliberately dropped. Plymouth stays installed so the LUKS unlock prompt keeps
# its themed background; see default/plymouth/kestrel.script.
KERNEL_CMDLINE[default]+=" initramfs_async=0"
# IRQ and timer latency (kernel plan C2.3): `threadirqs` turns device IRQ
# handlers into threads so rtirq can prioritize the audio, input and GPU ones;
# `rcu_nocbs=all` moves RCU callbacks off the housekeeping CPUs; the watchdog
# knobs remove the periodic NMI/lockup timers. The watchdog settings duplicate
# kernel.nmi_watchdog=0 in etc/sysctl.d/99-kestrel-sysctl.conf on purpose, so
# they also apply before the sysctl is read.
KERNEL_CMDLINE[default]+=" threadirqs rcu_nocbs=all nowatchdog nmi_watchdog=0"

CUSTOM_UKI_NAME="kestrel"
ENABLE_LIMINE_FALLBACK=yes

# Find and add other bootloaders
FIND_BOOTLOADERS=yes

# Prefer the upstream Arch kernel, then any other installed kernel, then
# fallbacks and snapshots.
BOOT_ORDER="linux, linux-lts, *, *fallback, Snapshots"

# Snapper is configured with NUMBER_LIMIT="5" (see default/snapper/root), but
# limine-snapper-sync can see the newly created sixth snapshot before cleanup
# restores the retained snapshot count to 5. Allow for that creation window:
#   Snapshot limit mismatch: 6 Snapper snapshots exceed configured
#   MAX_SNAPSHOT_ENTRIES=5
MAX_SNAPSHOT_ENTRIES=6

SNAPSHOT_FORMAT_CHOICE=5
