[Unit]
After=kestrel-slices.service
Wants=kestrel-slices.service

[Service]
Slice=kestrel-term.slice
LimitNOFILE=65536
Restart=on-failure
# Set the per-terminal rendering thread count from the CPU topology. Any
# explicit, non-zero workers= in foot.ini is preserved.
ExecStartPre=-/usr/bin/kestrel-foot-tune
